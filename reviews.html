<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leave a Review — JP</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      /* small page-specific tweaks */
      .review-form { max-width: 720px; margin: 1.5em auto; padding: 1em; }
      .review-form label { display:block; margin:0.5em 0 0.25em; }
      .review-form input[type="text"],
      .review-form input[type="email"],
      .review-form textarea,
      .review-form select { width:100%; padding:0.6em; border:1px solid #ccc; border-radius:3px; }
      .review-form .actions { margin-top:1em; }
      .success { background:#e6ffea; border:1px solid #b8f0c6; padding:0.8em; margin-top:1em; }
      .error { background:#ffe6e6; border:1px solid #f0b8b8; padding:0.8em; margin-top:1em; }
      .loading { color:#666; font-style:italic; }
    </style>
  </head>
  <body>
    <header id="header">
      <div class="inner">
        <a href="index.html" class="image avatar"><img src="images/avatar.jpg" alt="" /></a>
        <h1><strong>Juan Pablo Munoz Arroyo</strong></h1>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="reviews.html" class="active">Reviews</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div id="main">
      <section id="leave-review" class="review-form">
        <header class="major"><h2>Leave a Review</h2></header>

        <form id="reviewForm">
          <label for="r-name">Name *</label>
          <input id="r-name" name="name" type="text" required />

          <label for="r-rating">Rating</label>
          <select id="r-rating" name="rating">
            <option value="">— select —</option>
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Very good</option>
            <option value="3">3 — Good</option>
            <option value="2">2 — Fair</option>
            <option value="1">1 — Poor</option>
          </select>

          <label for="r-message">Message *</label>
          <textarea id="r-message" name="message" rows="6" required></textarea>

          <ul class="actions">
            <li><input type="submit" value="Submit Review" class="button primary" /></li>
            <li><input type="reset" value="Reset" /></li>
          </ul>
        </form>

        <div id="result" aria-live="polite"></div>
        <p><a href="index.html" class="button">Back to Home</a></p>
      </section>
    </div>

    <footer id="footer">
      <div class="inner">
        <ul class="copyright">
          <li>&copy; Untitled</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
        </ul>
      </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

    <script>
      // Initialize Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyDX4RRPAzOddJJ5p54xkxBPIDmXoQH2emQ",
        authDomain: "jp-srealestatepage.firebaseapp.com",
        databaseURL: "https://jp-srealestatepage-default-rtdb.firebaseio.com",
        projectId: "jp-srealestatepage",
        storageBucket: "jp-srealestatepage.appspot.com",
        messagingSenderId: "471433746617",
        appId: "1:471433746617:web:c56d61c13ce248c80ea368"
      };

      // Initialize Firebase
      const app = firebase.initializeApp(firebaseConfig);
      const database = firebase.database(app);
      const reviewsRef = database.ref('reviews');

      // Helper functions
      function trimOrEmpty(s) { return (s || '').trim(); }

      function showMessage(message, isSuccess = true) {
        const resultDiv = document.getElementById('result');
        const className = isSuccess ? 'success' : 'error';
        resultDiv.innerHTML = `<div class="${className}">${message}</div>`;
      }

      // Handle form submission
      document.getElementById('reviewForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        
        const name = trimOrEmpty(document.getElementById('r-name').value);
        const rating = trimOrEmpty(document.getElementById('r-rating').value);
        const message = trimOrEmpty(document.getElementById('r-message').value);

        if (!name || !message) {
          showMessage('Please provide your name and a message.', false);
          return;
        }

        // Show loading state
        showMessage('<span class="loading">Submitting your review...</span>', true);

        const review = {
          name: name,
          rating: rating || '',
          message: message,
          ts: new Date().toISOString()
        };

        // Push to Firebase
        reviewsRef.push(review)
          .then(() => {
            showMessage('Thank you — your review has been saved and is now live! <a href="index.html">Return to home to see it</a>.');
            document.getElementById('reviewForm').reset();
          })
          .catch((error) => {
            console.error('Error saving review:', error);
            showMessage('Error saving review. Please try again.', false);
          });
      });
    </script>
  </body>
</html>
